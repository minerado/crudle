[project]
name = "crudle"
version = "0.1.0"
description = "A CRUD library that simplifies working with SQLAlchemy"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.11.9",
    "sqlalchemy>=2.0.43",
]

[dependency-groups]
dev = [
    "alembic>=1.16.5",
    "ipdb>=0.13.13",
    "psycopg[binary]>=3.2.0",
    "pytest>=8.4.2",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
markers = [
    "postgres: requires Postgres (FTS / DISTINCT ON); set CRUDLE_TEST_DATABASE_URL to run",
]
